#
# SameSameC Windows XP compatible 32-bit build using MSYS2 MinGW
#
trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

steps:
- checkout: self
  submodules: true
  displayName: 'Checkout code'

- bash: |
    set -eux
    export PATH="/c/msys64/mingw32/bin:/c/msys64/usr/bin:$PATH"

    echo "Installing 32-bit MinGW toolchain..."
    pacman -Sy --noconfirm mingw-w64-i686-toolchain mingw-w64-i686-cmake

    echo "Verifying installation..."
    gcc --version
    gcc -dumpmachine
  displayName: 'Setup MSYS2 MinGW 32-bit'

- bash: |
    set -eux
    export PATH="/c/msys64/mingw32/bin:/c/msys64/usr/bin:$PATH"
    CMAKE_XP_FLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -static-libgcc"

    echo "Building SameSameC with 32-bit MinGW for Windows XP..."
    WLA_INCLUDE="$PWD/ci/relax_wla_dx_warnings.cmake"
    mkdir -p build-xp
    cd build-xp
    cmake .. -G "MinGW Makefiles" \
             -DCMAKE_C_COMPILER=gcc \
             -DCMAKE_BUILD_TYPE=Release \
             -DCMAKE_C_FLAGS="$CMAKE_XP_FLAGS"
    cmake --build . --config Release
    cd ..

    echo "Building WLA DX with 32-bit MinGW for Windows XP..."
    mkdir -p wla-dx/build-xp
    cd wla-dx/build-xp
    cmake .. -G "MinGW Makefiles" \
             -DCMAKE_C_COMPILER=gcc \
             -DCMAKE_BUILD_TYPE=Release \
             -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
             -DCMAKE_PROJECT_INCLUDE="$WLA_INCLUDE" \
             -DCMAKE_C_FLAGS="$CMAKE_XP_FLAGS"
    cmake --build . --config Release
    cd ../..

    echo "Build complete!"
  displayName: 'Build with MSYS2 MinGW 32-bit'

- powershell: |
    Write-Host "Verifying binaries..."

    if (Test-Path "build-xp\binaries") {
        $exes = Get-ChildItem -Path "build-xp\binaries" -Filter *.exe
        Write-Host "Found $($exes.Count) SameSameC executables in binaries folder:"
        $exes | ForEach-Object { Write-Host "  - $($_.Name)" }
    } else {
        Write-Host "ERROR: SameSameC binaries folder not found"
        exit 1
    }

    foreach ($name in @("samesamecc.exe", "samesamecl.exe")) {
        if (Test-Path "build-xp\binaries\$name") {
            Write-Host "Found $name"
        } else {
            Write-Host "ERROR: $name not found in binaries folder"
            Get-ChildItem -Path "build-xp" -Recurse -Filter $name | ForEach-Object {
                Write-Host "  Found at: $($_.FullName)"
            }
            exit 1
        }
    }
  displayName: 'Verify binaries'

- bash: |
    set -eux
    export PATH="$PWD/build-xp/binaries:$PWD/wla-dx/build-xp/binaries:$PATH"

    echo "PATH setup:"
    echo "$PATH" | tr ':' '\n'
    echo ""

    echo "Checking for executables..."
    which samesamecc
    which samesamecl
    which wla-z80
    which wlalink
    echo ""

    echo "Running tests..."
    bash ./run_tests.sh -windows-x86
  displayName: 'Run tests'

- template: ci/publish-test-failure-artifacts.yml

- powershell: |
    gci env:* | sort-object name | Format-Table -AutoSize | Out-File $env:BUILD_ARTIFACTSTAGINGDIRECTORY/environment-variables.txt
  displayName: 'Save environment variables'

- powershell: |
    $artifactBinaries = "$(Build.ArtifactStagingDirectory)\binaries"
    New-Item -ItemType Directory -Force -Path $artifactBinaries | Out-Null

    if (Test-Path "build-xp\binaries") {
        Copy-Item "build-xp\binaries\*" -Destination $artifactBinaries -Recurse -Force
        Write-Host "Copied from build-xp\binaries"
    }

    if (Test-Path "wla-dx\build-xp\binaries") {
        Copy-Item "wla-dx\build-xp\binaries\*" -Destination $artifactBinaries -Recurse -Force
        Write-Host "Copied from wla-dx\build-xp\binaries"
    }

    Write-Host "`nFinal artifact contents:"
    Get-ChildItem -Path $artifactBinaries | ForEach-Object { Write-Host "  - $($_.Name)" }
  displayName: 'Prepare artifacts'

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)/binaries'
    artifactName: 'SameSameC-Windows-XP-32bit'
  displayName: 'Publish artifacts'
