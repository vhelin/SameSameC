#
# SameSameC Windows build script for CMake + MSVC
#

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

strategy:
  matrix:
    Debug_Build:
      config: 'Debug'
    Release_Build:
      config: 'Release'

steps:
- checkout: self
  submodules: true

- script: |
    cmake . -B build || exit /b 1
    cmake --build build --config $(config) -j || exit /b 1
    cmake wla-dx -B wla-dx/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 || exit /b 1
    cmake --build wla-dx/build --config $(config) -j || exit /b 1
  displayName: 'Build $(config)'

- bash: |
    set -eux
    export PATH="$PWD/build/binaries/$(config):$PWD/wla-dx/build/binaries/$(config):$PATH"

    echo "Checking for binaries in: $PWD/build/binaries/$(config)"
    ls -l "$PWD/build/binaries/$(config)"
    echo "Checking for WLA DX binaries in: $PWD/wla-dx/build/binaries/$(config)"
    ls -l "$PWD/wla-dx/build/binaries/$(config)"

    test -x "$PWD/build/binaries/$(config)/samesamecc.exe"
    test -x "$PWD/build/binaries/$(config)/samesamecl.exe"

    bash ./run_tests.sh
  displayName: 'Run Tests ($(config))'
  workingDirectory: '$(Build.SourcesDirectory)'

- template: ci/publish-test-failure-artifacts.yml
